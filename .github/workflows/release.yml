name: Release

# Push a tag like v0.3.0 (matching the version in package.json) to build the
# Windows portable exe and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        shell: bash
        run: |
          v="$(node -p "require('./packages/app/package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$v" != "$tag" ]; then echo "tag v$tag != app version $v"; exit 1; fi
      - name: Typecheck and test
        shell: bash
        run: |
          npm run typecheck
          npx tsc --noEmit -p packages/app/tsconfig.node.json
          npx tsc --noEmit -p packages/app/tsconfig.web.json
          npx vitest run
      - name: Build
        run: npm run build -w packages/app
      - name: Package (portable exe + zip)
        run: npx electron-builder --win --config electron-builder.yml --projectDir packages/app --publish never
      - name: Release notes file for the friend-facing zip
        shell: bash
        run: cp "packages/app/release/bundle/READ ME FIRST.txt" packages/app/release/ 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/app/release/*.exe
            packages/app/release/*.zip
